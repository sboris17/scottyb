# XcodeGen spec. This is the source of truth for the app target.
#
#   brew install xcodegen && xcodegen generate && open Push.xcodeproj
#
# The four packages under Packages/ are plain SwiftPM and need none of this:
# `swift test` runs the engine, stats and program suites on their own.
name: Push
options:
  bundleIdPrefix: app.push
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RepEngine:
    path: Packages/RepEngine
  PushCore:
    path: Packages/PushCore
  TrainingEngine:
    path: Packages/TrainingEngine
  PushUI:
    path: Packages/PushUI
  PushSync:
    path: Packages/PushSync

targets:
  Push:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    # XcodeGen GENERATES this file, so it must be described here in full and
    # must not be hand-edited: anything written into the file directly is
    # silently destroyed on the next `xcodegen generate`. It is written to a
    # gitignored directory so it can never show up as a spurious local change.
    info:
      path: App/Generated/Info.plist
      properties:
        CFBundleDisplayName: PressOn
        # Track the build settings so the version lives in one place. Without
        # these the generated plist hard-codes 1.0, which is why the first
        # archive read 1.0 while the project said otherwise.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Without this key iOS terminates the app the instant it touches the
        # camera. It is the difference between the counter working and the app
        # dying at START, and the build succeeds either way.
        NSCameraUsageDescription: "PressOn uses the camera to count your push-ups. Video is analysed on your device and immediately discarded - nothing is recorded and nothing is uploaded."
        # Answers export compliance up front so App Store Connect stops asking
        # on every upload.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Committed rather than edited locally. Neither is a secret - a team
        # ID is readable from any shipped app - and keeping them here means
        # project.yml never carries uncommitted changes, so it never conflicts
        # on a pull. Bump CURRENT_PROJECT_VERSION for every TestFlight upload:
        # App Store Connect rejects a build number it has already accepted.
        PRODUCT_BUNDLE_IDENTIFIER: com.scottsmanboris.pushreps
        DEVELOPMENT_TEAM: "FX6Z68JYQ4"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # Sign in with Apple. This REQUIRES the capability to be enabled on
        # the App ID first, at developer.apple.com (Certificates, Identifiers
        # & Profiles -> com.scottsmanboris.pushreps -> tick Sign In with
        # Apple -> Save). Without that, every build and archive fails with a
        # provisioning error that names the entitlement rather than the
        # missing capability, which is a miserable way to learn the ordering.
        #
        # It lives here rather than being switched on locally because a local
        # edit to this file conflicts on every pull, which has already cost an
        # evening once.
        CODE_SIGN_ENTITLEMENTS: App/Push.entitlements
    dependencies:
      - package: RepEngine
      - package: PushCore
      - package: TrainingEngine
      - package: PushUI
      - package: PushSync

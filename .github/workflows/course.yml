name: Verify courses

# Runs on every branch: a broken exercise should be caught before review, not at merge.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify lessons and exercises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Coding 101: every reference solution passes, every starter fails.
      - name: Verify Coding 101
        run: npm run verify:code

      # The spreadsheet engine, pinned to real Google Sheets behaviour.
      - name: Test the formula engine
        run: npm run test:engine

      # Google Sheets 101: solutions pass, starting states do not, answers land in
      # cells the learner can actually edit.
      - name: Verify Google Sheets 101
        run: npm run verify:sheets

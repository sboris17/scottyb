name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  course-geometry:
    name: Validate course geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the hole spec is well-formed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/course-holes.json','utf8'))"

      - name: Validate all eighteen holes
        run: node scripts/validate-holes.mjs
